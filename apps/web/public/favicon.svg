<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    执行图的缩影：两条上游任务汇进一个人类决策点，再向下继续流动。
    产品的一句话就是这个形状 —— 项目自己往前流，关键节点上有人。
  -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />
  <g stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M10 10 L16 16" />
    <path d="M22 10 L16 16" />
    <path d="M16 16 L16 23" />
  </g>
  <circle cx="10" cy="10" r="3" fill="#6366f1" />
  <circle cx="22" cy="10" r="3" fill="#6366f1" />
  <!-- 决策点用 gate 色，和看板上的 Human Gate 同一个语义色 -->
  <circle cx="16" cy="16" r="3.4" fill="#f59e0b" />
  <circle cx="16" cy="24.5" r="2.6" fill="#34d399" />
</svg>
