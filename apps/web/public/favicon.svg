<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    执行图的缩影：两条上游任务汇进一个人类决策点，再向下继续流动。
    产品的一句话就是这个形状 —— 项目自己往前流，关键节点上有人。

    ★ 和界面里的 BrandMark（src/components/BrandMark.tsx）是同一个图形，
      同一条渐变。标签页上认出来的和界面左上角认出来的必须是同一个东西 ——
      两处各画一版的话，收藏夹里那个小图标就跟这个产品没关系了。
  -->
  <defs>
    <linearGradient id="apos" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#5b8cff" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#apos)" />
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M9 9 L16 16" />
    <path d="M23 9 L16 16" />
    <path d="M16 16 L16 24" />
  </g>
  <circle cx="9" cy="9" r="3" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="23" cy="9" r="3" fill="#ffffff" fill-opacity="0.9" />
  <!-- 决策点最实 —— 它是这张图里唯一「人」在的位置 -->
  <circle cx="16" cy="16" r="3.6" fill="#ffffff" />
  <circle cx="16" cy="25" r="2.6" fill="#ffffff" fill-opacity="0.9" />
</svg>
